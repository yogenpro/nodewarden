name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# FORK PATCH (see FORK.md — fork-patch:workers-dev-off)
# Kept identical to wrangler.toml on purpose: this is the alternate storage
# backend for the same worker name, so a `deploy:kv` run would otherwise
# re-enable both doors that wrangler.toml closes.
workers_dev = false
preview_urls = false

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[kv_namespaces]]
binding = "ATTACHMENTS_KV"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]
